<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ROAM — Road · Ocean · Air · Movement</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1410;--muted:#6b6056;--cream:#f7f3ed;--sand:#e8dfd0;
  --earth:#b8956a;--bark:#7a5c3a;
  --road:#c87820;--ocean:#0a4a6e;--air:#4a2870;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:#0f0c09;color:#fff;font-weight:300}

/* NAV */
nav{position:fixed;inset:0 0 auto;z-index:200;display:flex;justify-content:space-between;
align-items:center;padding:1.8rem 4rem}
.logo{font-family:var(--serif);font-size:1.8rem;letter-spacing:.25em;color:#fff;
text-decoration:none;font-weight:300}
.nav-cta{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.6);
text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:.5rem 1.6rem;transition:all .3s}
.nav-cta:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.6)}

/* HERO — 3 panels */
.hero{height:100vh;display:grid;grid-template-columns:1fr 1fr 1fr;position:relative}

.panel{position:relative;overflow:hidden;cursor:pointer;text-decoration:none;display:block}
.panel img{width:100%;height:100%;object-fit:cover;display:block;
transition:transform .9s ease,filter .5s;filter:brightness(.55)}
.panel:hover img{transform:scale(1.06);filter:brightness(.35)}

/* divider lines */
.panel:not(:last-child)::after{content:'';position:absolute;top:0;right:0;bottom:0;
width:1px;background:rgba(255,255,255,.18);z-index:3}

/* panel label */
.panel-label{position:absolute;bottom:0;left:0;right:0;
padding:3rem 2.5rem;z-index:4;
background:linear-gradient(to top,rgba(15,12,9,.85) 0%,transparent 100%);
transition:padding .4s}
.panel:hover .panel-label{padding-bottom:3.5rem}

.panel-mode{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
color:rgba(255,255,255,.5);margin-bottom:.5rem;display:block;transition:color .3s}
.panel:hover .panel-mode{color:rgba(255,255,255,.8)}

.panel-name{font-family:var(--serif);font-size:2.8rem;color:#fff;letter-spacing:.1em;
display:block;line-height:1;font-weight:300;margin-bottom:.6rem}

.panel-sub{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
color:rgba(255,255,255,.45);display:block;margin-bottom:1.4rem}

.panel-cta{display:inline-block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
color:#fff;border:1px solid rgba(255,255,255,.35);padding:.5rem 1.4rem;
opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s,background .3s}
.panel:hover .panel-cta{opacity:1;transform:translateY(0)}
.panel-road .panel-cta{border-color:var(--road);color:var(--road)}
.panel-road:hover .panel-cta{background:var(--road);color:#fff}
.panel-ocean .panel-cta{border-color:#4da6d4;color:#4da6d4}
.panel-ocean:hover .panel-cta{background:#0a4a6e;color:#fff}
.panel-air .panel-cta{border-color:#9b6fd4;color:#9b6fd4}
.panel-air:hover .panel-cta{background:#4a2870;color:#fff}

/* center overlay */
.hero-center{position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;z-index:10;pointer-events:none;text-align:center}
.hero-title{font-family:var(--serif);font-size:clamp(5rem,11vw,9rem);font-weight:300;
color:#fff;letter-spacing:.2em;line-height:1;
text-shadow:0 2px 60px rgba(0,0,0,.5);
transition:opacity .4s}
.hero-tagline{font-family:var(--serif);font-style:italic;
font-size:clamp(.9rem,1.6vw,1.15rem);color:rgba(255,255,255,.6);
letter-spacing:.1em;margin-top:.9rem}

/* hint at bottom */
.hero-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
z-index:10;text-align:center;pointer-events:none;animation:pulse 2.5s ease-in-out infinite}
.hero-hint span{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.3)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}

/* colour accent bars (top of each panel) */
.panel-road::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
background:var(--road);z-index:5;transform:scaleX(0);transform-origin:left;transition:transform .5s}
.panel-ocean::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
background:var(--ocean);z-index:5;transform:scaleX(0);transform-origin:left;transition:transform .5s}
.panel-air::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
background:var(--air);z-index:5;transform:scaleX(0);transform-origin:left;transition:transform .5s}
.panel:hover::before{transform:scaleX(1)}

@media(max-width:768px){
  html,body{overflow:auto}
  .hero{grid-template-columns:1fr;height:auto}
  .panel{height:50vh}
  .hero-center{display:none}
  nav{padding:1.2rem 1.5rem}
  .logo{font-size:1.4rem}
}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">ROAM</a>
  <a href="mailto:hello@roamtravel.co" class="nav-cta">Begin a Journey</a>
</nav>

<!-- HERO — 3 clickable panels -->
<div class="hero">

  <a class="panel panel-road" href="road.html">
    <img src="https://design.canva.ai/msfTtD_94ZUbjfX" alt="Road travel"/>
    <div class="panel-label">
      <span class="panel-mode">01 · Road</span>
      <span class="panel-name">ROAD</span>
      <span class="panel-sub">Highways · Passes · Overland</span>
      <span class="panel-cta">Explore Road →</span>
    </div>
  </a>

  <a class="panel panel-ocean" href="ocean.html">
    <img src="https://design.canva.ai/OJIEwbe3NDJyZ9v" alt="Ocean travel"/>
    <div class="panel-label">
      <span class="panel-mode">02 · Ocean</span>
      <span class="panel-name">OCEAN</span>
      <span class="panel-sub">Sailing · Cruises · Islands</span>
      <span class="panel-cta">Explore Ocean →</span>
    </div>
  </a>

  <a class="panel panel-air" href="air.html">
    <img src="https://design.canva.ai/Ww9bJUSbE-awHER" alt="Air travel"/>
    <div class="panel-label">
      <span class="panel-mode">03 · Air</span>
      <span class="panel-name">AIR</span>
      <span class="panel-sub">Balloons · Helicopters · Flights</span>
      <span class="panel-cta">Explore Air →</span>
    </div>
  </a>

  <div class="hero-center">
    <h1 class="hero-title">ROAM</h1>
    <p class="hero-tagline">Road · Ocean · Air · Movement</p>
  </div>

  <div class="hero-hint">
    <span>Choose your way to move through the world</span>
  </div>
</div>

<script>
// Fade the ROAM title when hovering a panel
const panels = document.querySelectorAll('.panel');
const title = document.querySelector('.hero-center');
panels.forEach(p => {
  p.addEventListener('mouseenter', () => title.style.opacity = '.15');
  p.addEventListener('mouseleave', () => title.style.opacity = '1');
});
</script>
</body>
</html>
